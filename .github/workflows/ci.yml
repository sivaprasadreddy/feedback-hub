name: Build

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on:
  push:
    branches: [ "main", "dev", "fix/*", "feat/*" ]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".sdkmanrc"
      - "README.md"
      - "LICENSE"
      - "Taskfile.yml"
      - "renovate.json"
      - "docs/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25.0.4+101.0.LTS
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -ntp verify

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Sonar Scan
        run: |
          cd feedbackhub
          mvn initialize sonar:sonar -Dsonar.token=${{ env.SONAR_TOKEN }}
