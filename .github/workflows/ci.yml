name: Build

on:
  push:
    branches: [ "main", "dev", "fix/*", "feat/*" ]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".sdkmanrc"
      - "README.md"
      - "LICENSE"
      - "Taskfile.yml"
      - "renovate.json"
      - "docs/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw -ntp verify
