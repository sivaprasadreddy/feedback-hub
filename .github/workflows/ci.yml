name: Build

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

on:
  pull_request:
  merge_group:
  push:
    branches: [ "main", "dev", "fix/*", "feat/*" ]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".gitattributes"
      - ".sdkmanrc"
      - "README.md"
      - "LICENSE"
      - "Taskfile.yml"
      - "renovate.json"
      - "docs/**"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mise
        uses: jdx/mise-action@v5

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: mise run verify

      - if: ${{ github.ref == 'refs/heads/main' }}
        name: Sonar Scan
        run: |
          cd feedbackhub
          mvn initialize sonar:sonar -Dsonar.token=${{ env.SONAR_TOKEN }}
