<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard}">
<head>
    <title>Sentiment Analysis</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Sentiment Analysis</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-300">See how analyzed feedback is distributed over a selected period.</p>

    <form method="get" th:action="@{/admin/sentiment-analysis}"
          class="mt-6 grid gap-4 rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800 sm:grid-cols-[1fr_1fr_auto_auto] sm:items-end">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
            Start date <span class="font-normal text-slate-500">(optional)</span>
            <input type="date" name="startDate" th:value="${startDate}"
                   class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100">
        </label>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-200">
            End date <span class="font-normal text-slate-500">(optional)</span>
            <input type="date" name="endDate" th:value="${endDate}"
                   class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-900 dark:border-slate-600 dark:bg-slate-900 dark:text-slate-100">
        </label>
        <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white hover:bg-sky-700">Apply</button>
        <a th:href="@{/admin/sentiment-analysis}" class="rounded-lg border border-slate-300 px-4 py-2 text-center font-semibold text-slate-700 hover:bg-slate-50 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-700">Clear</a>
        <p th:if="${dateError}" th:text="${dateError}" role="alert"
           class="text-sm font-medium text-rose-700 dark:text-rose-300 sm:col-span-4">Invalid date range.</p>
    </form>

    <section class="mt-6 rounded-xl border border-slate-200 bg-white p-6 shadow-sm dark:border-slate-700 dark:bg-slate-800" aria-labelledby="chart-title">
        <h2 id="chart-title" class="text-lg font-semibold text-slate-900 dark:text-slate-100">Messages by sentiment</h2>
        <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Only messages that have been analyzed are included.</p>
        <div class="mt-6 space-y-5" role="img" aria-label="Bar chart of message counts by sentiment">
            <div th:each="item : ${sentimentCounts}" class="grid grid-cols-[7rem_1fr_3rem] items-center gap-3">
                <span th:text="${item.displayName()}" class="text-sm font-medium text-slate-700 dark:text-slate-200">Neutral</span>
                <div class="h-8 overflow-hidden rounded bg-slate-100 dark:bg-slate-700">
                    <div th:style="|width: ${item.percentage()}%|"
                         class="h-full min-w-0 rounded bg-sky-500 transition-all"
                         th:attr="aria-label=|${item.displayName()}: ${item.count()} messages|"></div>
                </div>
                <span th:text="${item.count()}" class="text-right text-sm font-bold text-slate-900 dark:text-slate-100">0</span>
            </div>
        </div>
    </section>
</div>
</body>
</html>
