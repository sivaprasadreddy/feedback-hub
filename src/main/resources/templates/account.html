<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{dashboard}">
<head><title>My Account</title></head>
<body>
<div layout:fragment="content">
    <h1 class="text-2xl font-bold text-slate-900">My Account</h1>
    <p class="mt-2 text-slate-600">View your details and manage your profile.</p>
    <div class="mt-6 grid gap-6 lg:grid-cols-3">
        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="account-heading">
            <h2 id="account-heading" class="text-lg font-bold text-slate-900">Account</h2>
            <dl class="mt-4 divide-y divide-slate-200">
                <div class="py-3"><dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Name</dt><dd class="mt-1 text-sm text-slate-900" th:text="${account.name()}">User</dd></div>
                <div class="py-3"><dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Email</dt><dd class="mt-1 break-all text-sm text-slate-900" th:text="${account.email()}">user@example.com</dd></div>
                <div class="py-3"><dt class="text-xs font-semibold uppercase tracking-wide text-slate-500">Role</dt><dd class="mt-1 text-sm text-slate-900" id="current-role" th:text="${account.role()}">ROLE_USER</dd></div>
            </dl>
        </section>
        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="picture-heading">
            <h2 id="picture-heading" class="text-lg font-bold text-slate-900">Profile picture</h2>
            <div class="mt-4 flex h-28 w-28 items-center justify-center overflow-hidden rounded-full bg-slate-100 text-slate-400">
                <img th:if="${account.hasProfilePicture()}" th:src="@{/account/profile-picture}" alt="Current profile picture" class="h-full w-full object-cover"/>
                <i th:unless="${account.hasProfilePicture()}" class="fa-solid fa-user text-5xl" aria-hidden="true"></i>
            </div>
            <form method="post" enctype="multipart/form-data" th:action="@{/account/profile-picture}" class="mt-5 space-y-4">
                <label for="profile-picture" class="block text-sm font-semibold text-slate-700" th:text="${account.hasProfilePicture()} ? 'Replace profile picture' : 'Upload profile picture'">Upload profile picture</label>
                <input id="profile-picture" name="profilePicture" type="file" accept="image/jpeg,image/png,image/gif,image/webp" required class="block w-full text-sm text-slate-600 file:mr-3 file:rounded-lg file:border-0 file:bg-slate-100 file:px-3 file:py-2 file:font-semibold file:text-slate-700 hover:file:bg-slate-200"/>
                <p class="text-xs text-slate-500">JPEG, PNG, GIF, or WebP. Maximum size: 1 MB.</p>
                <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700" th:text="${account.hasProfilePicture()} ? 'Replace picture' : 'Upload picture'">Upload picture</button>
            </form>
        </section>
        <section class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm" aria-labelledby="password-heading">
            <h2 id="password-heading" class="text-lg font-bold text-slate-900">Change password</h2>
            <form method="post" th:action="@{/account/password}" th:object="${passwordForm}" class="mt-4 space-y-4">
                <div><label for="current-password" class="block text-sm font-semibold text-slate-700">Current password</label><input id="current-password" type="password" autocomplete="current-password" th:field="*{currentPassword}" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2"/><p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="mt-2 text-sm text-rose-600"></p></div>
                <div><label for="new-password" class="block text-sm font-semibold text-slate-700">New password</label><input id="new-password" type="password" autocomplete="new-password" th:field="*{newPassword}" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2"/><p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="mt-2 text-sm text-rose-600"></p></div>
                <div><label for="confirm-password" class="block text-sm font-semibold text-slate-700">Confirm new password</label><input id="confirm-password" type="password" autocomplete="new-password" th:field="*{confirmPassword}" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2"/><p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="mt-2 text-sm text-rose-600"></p></div>
                <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Change password</button>
            </form>
        </section>
    </div>
</div>
</body>
</html>
