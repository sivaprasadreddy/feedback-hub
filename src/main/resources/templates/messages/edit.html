<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main}">
<head>
    <title>Edit Message</title>
</head>
<body>
<div layout:fragment="content">
    <a th:href="@{/messages/{id}(id=${messageId})}" class="text-sm font-semibold text-sky-700 hover:text-sky-900">← Back to message</a>
    <form method="post" th:action="@{/messages/{id}/edit(id=${messageId})}" th:object="${form}"
          class="mt-4 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div>
            <label for="content" class="mb-2 block text-sm font-semibold text-slate-700">Message</label>
            <textarea id="content" rows="6" th:field="*{content}"
                      class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"></textarea>
            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-2 text-sm text-rose-600"></p>
        </div>
        <p class="text-sm text-slate-500">The original posting identity cannot be changed.</p>
        <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Save changes</button>
    </form>
</div>
</body>
</html>
