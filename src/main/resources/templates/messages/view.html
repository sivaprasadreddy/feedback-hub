<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main}">
<head>
    <title>View Message</title>
</head>
<body>
<div layout:fragment="content">
    <a th:href="@{/}" class="text-sm font-semibold text-sky-700 hover:text-sky-900">← Back to feedback</a>
    <article class="mt-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div class="flex flex-wrap items-center justify-between gap-3">
            <p class="font-semibold text-slate-900" th:text="${message.visibleAuthor()}">Author</p>
            <time class="text-sm text-slate-500"
                  th:text="${message.createdAt() != null ? #temporals.format(message.createdAt(), 'yyyy-MM-dd HH:mm') : ''}">Created</time>
        </div>
        <p class="mt-4 whitespace-pre-wrap text-slate-700"
           th:classappend="${message.deleted()} ? ' italic text-slate-500' : ''"
           th:text="${message.content()}">Message</p>
        <div th:if="${message.editable()}" class="mt-4 flex items-center gap-4">
            <a th:href="@{/messages/{id}/edit(id=${message.id()})}"
               class="text-sm font-semibold text-sky-700 hover:text-sky-900">Edit message</a>
            <form method="post" th:action="@{/messages/{id}/delete(id=${message.id()})}">
                <button type="submit" class="text-sm font-semibold text-rose-700 hover:text-rose-900">Delete message</button>
            </form>
        </div>
        <dl class="mt-6 grid grid-cols-2 gap-4 border-t border-slate-200 pt-4 sm:grid-cols-3">
            <div class="flex items-center gap-2">
                <dt>
                    <form th:if="${message.votable()}" method="post"
                          th:action="${message.currentUserVote() == 'UPVOTE'} ? @{/messages/{id}/vote/remove(id=${message.id()})} : @{/messages/{id}/vote(id=${message.id()})}">
                        <input type="hidden" name="voteType" value="UPVOTE"/>
                        <button type="submit" class="rounded p-1 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                th:classappend="${message.currentUserVote() == 'UPVOTE'} ? ' text-emerald-600' : ' text-slate-500'"
                                th:title="${message.currentUserVote() == 'UPVOTE'} ? 'Remove your upvote' : 'Upvote message'">
                            <i class="fa-solid fa-thumbs-up" aria-hidden="true"></i>
                            <span class="sr-only" th:text="${message.currentUserVote() == 'UPVOTE'} ? 'Remove your upvote' : 'Upvote message'">Upvote message</span>
                        </button>
                    </form>
                    <span th:unless="${message.votable()}" class="text-slate-500" title="Upvotes"><i class="fa-solid fa-thumbs-up" aria-hidden="true"></i><span class="sr-only">Upvotes</span></span>
                </dt>
                <dd class="text-lg font-bold text-slate-900" th:text="${message.upvoteCount()}">0</dd>
            </div>
            <div class="flex items-center gap-2">
                <dt>
                    <form th:if="${message.votable()}" method="post"
                          th:action="${message.currentUserVote() == 'DOWNVOTE'} ? @{/messages/{id}/vote/remove(id=${message.id()})} : @{/messages/{id}/vote(id=${message.id()})}">
                        <input type="hidden" name="voteType" value="DOWNVOTE"/>
                        <button type="submit" class="rounded p-1 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500"
                                th:classappend="${message.currentUserVote() == 'DOWNVOTE'} ? ' text-amber-600' : ' text-slate-500'"
                                th:title="${message.currentUserVote() == 'DOWNVOTE'} ? 'Remove your downvote' : 'Downvote message'">
                            <i class="fa-solid fa-thumbs-down" aria-hidden="true"></i>
                            <span class="sr-only" th:text="${message.currentUserVote() == 'DOWNVOTE'} ? 'Remove your downvote' : 'Downvote message'">Downvote message</span>
                        </button>
                    </form>
                    <span th:unless="${message.votable()}" class="text-slate-500" title="Downvotes"><i class="fa-solid fa-thumbs-down" aria-hidden="true"></i><span class="sr-only">Downvotes</span></span>
                </dt>
                <dd class="text-lg font-bold text-slate-900" th:text="${message.downvoteCount()}">0</dd>
            </div>
            <div>
                <dt class="text-slate-500" title="Replies"><i class="fa-solid fa-comment" aria-hidden="true"></i><span class="sr-only">Replies</span></dt>
                <dd class="mt-1 text-lg font-bold text-slate-900" th:text="${message.replyCount()}">0</dd>
            </div>
        </dl>
    </article>
    <section class="mt-6" aria-labelledby="replies-heading">
        <h2 id="replies-heading" class="text-xl font-bold text-slate-900">Replies</h2>
        <div class="mt-4 space-y-4">
            <article th:each="reply : ${replies}" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <p class="font-semibold text-slate-900" th:text="${reply.visibleAuthor()}">Author</p>
                    <div class="text-right text-xs text-slate-500">
                        Created <time th:text="${reply.createdAt() != null ? #temporals.format(reply.createdAt(), 'yyyy-MM-dd HH:mm') : ''}">Created</time>
                        · Updated <time th:text="${reply.updatedAt() != null ? #temporals.format(reply.updatedAt(), 'yyyy-MM-dd HH:mm') : ''}">Updated</time>
                    </div>
                </div>
                <p class="mt-3 whitespace-pre-wrap text-slate-700"
                   th:classappend="${reply.deleted()} ? ' italic text-slate-500' : ''"
                   th:text="${reply.content()}">Reply</p>
                <div th:if="${reply.editable()}" class="mt-3 flex items-center gap-4">
                    <a th:href="@{/messages/{messageId}/replies/{replyId}/edit(messageId=${message.id()},replyId=${reply.id()})}"
                       class="text-sm font-semibold text-sky-700 hover:text-sky-900">Edit reply</a>
                    <form method="post"
                          th:action="@{/messages/{messageId}/replies/{replyId}/delete(messageId=${message.id()},replyId=${reply.id()})}">
                        <button type="submit" class="text-sm font-semibold text-rose-700 hover:text-rose-900">Delete reply</button>
                    </form>
                </div>
                <dl class="mt-4 flex flex-wrap gap-6 border-t border-slate-200 pt-3 text-sm">
                    <div class="flex items-center gap-1"><dt><form th:if="${reply.votable()}" method="post" th:action="${reply.currentUserVote() == 'UPVOTE'} ? @{/messages/{messageId}/replies/{replyId}/vote/remove(messageId=${message.id()},replyId=${reply.id()})} : @{/messages/{messageId}/replies/{replyId}/vote(messageId=${message.id()},replyId=${reply.id()})}"><input type="hidden" name="voteType" value="UPVOTE"/><button type="submit" class="rounded p-1 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" th:classappend="${reply.currentUserVote() == 'UPVOTE'} ? ' text-emerald-600' : ' text-slate-500'" th:title="${reply.currentUserVote() == 'UPVOTE'} ? 'Remove your reply upvote' : 'Upvote reply'"><i class="fa-solid fa-thumbs-up" aria-hidden="true"></i><span class="sr-only" th:text="${reply.currentUserVote() == 'UPVOTE'} ? 'Remove your reply upvote' : 'Upvote reply'">Upvote reply</span></button></form><span th:unless="${reply.votable()}" class="text-slate-500" title="Upvotes"><i class="fa-solid fa-thumbs-up" aria-hidden="true"></i><span class="sr-only">Upvotes</span></span></dt> <dd th:text="${reply.upvoteCount()}">0</dd></div>
                    <div class="flex items-center gap-1"><dt><form th:if="${reply.votable()}" method="post" th:action="${reply.currentUserVote() == 'DOWNVOTE'} ? @{/messages/{messageId}/replies/{replyId}/vote/remove(messageId=${message.id()},replyId=${reply.id()})} : @{/messages/{messageId}/replies/{replyId}/vote(messageId=${message.id()},replyId=${reply.id()})}"><input type="hidden" name="voteType" value="DOWNVOTE"/><button type="submit" class="rounded p-1 hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500" th:classappend="${reply.currentUserVote() == 'DOWNVOTE'} ? ' text-amber-600' : ' text-slate-500'" th:title="${reply.currentUserVote() == 'DOWNVOTE'} ? 'Remove your reply downvote' : 'Downvote reply'"><i class="fa-solid fa-thumbs-down" aria-hidden="true"></i><span class="sr-only" th:text="${reply.currentUserVote() == 'DOWNVOTE'} ? 'Remove your reply downvote' : 'Downvote reply'">Downvote reply</span></button></form><span th:unless="${reply.votable()}" class="text-slate-500" title="Downvotes"><i class="fa-solid fa-thumbs-down" aria-hidden="true"></i><span class="sr-only">Downvotes</span></span></dt> <dd th:text="${reply.downvoteCount()}">0</dd></div>
                </dl>
            </article>
            <p th:if="${#lists.isEmpty(replies)}" class="rounded-xl border border-dashed border-slate-300 p-5 text-center text-slate-500">No replies yet.</p>
        </div>
    </section>
    <form th:if="${!message.deleted()}" method="post" th:action="@{/messages/{id}/replies(id=${message.id()})}"
          th:object="${replyForm}" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div>
            <label for="reply-content" class="mb-2 block text-sm font-semibold text-slate-700">Reply</label>
            <textarea id="reply-content" rows="4" th:field="*{content}" placeholder="Write a reply..."
                      class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"></textarea>
            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-2 text-sm text-rose-600"></p>
        </div>
        <fieldset>
            <legend class="mb-2 text-sm font-semibold text-slate-700">Reply as</legend>
            <div class="flex flex-wrap gap-4">
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="radio" th:field="*{postingIdentity}" value="IDENTIFIED"/> Myself
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="radio" th:field="*{postingIdentity}" value="ANONYMOUS"/> Anonymous
                </label>
            </div>
            <p th:if="${#fields.hasErrors('postingIdentity')}" th:errors="*{postingIdentity}" class="mt-2 text-sm text-rose-600"></p>
        </fieldset>
        <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Post reply</button>
    </form>
</div>
</body>
</html>
