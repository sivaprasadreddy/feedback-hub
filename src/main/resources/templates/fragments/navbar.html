<header th:fragment="topbar(showSidebarToggle)"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
        class="fixed inset-x-0 top-0 z-30 h-16 border-b border-slate-700 bg-slate-900">
    <div class="flex h-full items-center justify-between px-4 sm:px-6"
         th:classappend="${!showSidebarToggle} ? ' mx-auto max-w-7xl lg:px-8' : ''">
        <div class="flex items-center gap-3">
            <button type="button" th:if="${showSidebarToggle}" onclick="toggleSidebar()"
                    class="inline-flex h-10 w-10 items-center justify-center rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white md:hidden"
                    aria-label="Toggle menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <a th:href="@{/}" class="text-lg font-bold text-white">SpeakUp</a>
        </div>
        <div class="relative" sec:authorize="isAuthenticated()">
            <button type="button" onclick="toggleUserDropdown()" id="user-menu-button"
                    class="inline-flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800 hover:text-white">
                <i class="fa-solid fa-user"></i>
                <span th:text="${#authentication.principal.name}">User</span>
                <i class="fa-solid fa-chevron-down text-xs"></i>
            </button>
            <div id="user-dropdown"
                 class="hidden absolute right-0 z-10 mt-2 w-48 origin-top-right rounded-md bg-white py-1 shadow-lg ring-1 ring-black/5">
                <a th:href="@{/dashboard}" class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                    <i class="fa-solid fa-gauge-high mr-2"></i> Dashboard
                </a>
                <form method="post" th:action="@{/logout}">
                    <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-100">
                        <i class="fa-solid fa-right-from-bracket mr-2"></i> Logout
                    </button>
                </form>
            </div>
        </div>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/login}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-200 hover:bg-slate-800 hover:text-white">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Login
            </a>
        </div>
    </div>
</header>
