<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="message(message)" class="admin-message rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="flex flex-wrap items-center gap-3">
        <p class="font-semibold text-slate-900" th:text="${message.visibleAuthor()}">Author</p>
        <time class="text-xs text-slate-500" th:text="${message.createdAt() != null ? #temporals.format(message.createdAt(), 'dd MMM yyyy HH:mm') : ''}">20 Sept 2026 14:30</time>
    </div>
    <p class="mt-3 whitespace-pre-wrap text-slate-700" th:classappend="${message.deleted()} ? ' italic text-slate-500' : ''" th:text="${message.content()}">Message</p>
    <p th:if="${analysisError}" class="mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm font-medium text-red-800"
       th:text="${analysisError}">Analysis failed.</p>
    <div th:if="${message.analyzed()}" class="mt-3 flex flex-wrap items-center gap-2">
        <span class="rounded-full bg-violet-100 px-2.5 py-1 text-xs font-semibold text-violet-700"
              th:text="${message.sentiment().displayName}">Happy</span>
        <span th:each="topic : ${message.topics()}"
              class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600"
              th:text="${topic}">Topic</span>
    </div>
    <div class="mt-4 flex flex-wrap items-center gap-4">
        <form th:if="${!message.deleted() && !message.analyzed()}" method="post"
              th:action="@{/admin/messages/{id}/analyze(id=${message.id()})}"
              th:hx-post="@{/admin/messages/{id}/analyze(id=${message.id()})}"
              hx-target="closest .admin-message" hx-swap="outerHTML">
            <button type="submit" class="text-sm font-semibold text-sky-700 hover:text-sky-900">Analyze message</button>
        </form>
        <form th:if="${!message.deleted()}" method="post" th:action="@{/admin/messages/{id}/delete(id=${message.id()})}">
            <button type="submit" class="text-sm font-semibold text-rose-700 hover:text-rose-900">Delete message</button>
        </form>
    </div>
</article>
</body>
</html>
