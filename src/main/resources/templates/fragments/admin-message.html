<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<body>
<article th:fragment="message(message)" class="admin-message rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 p-5 shadow-sm">
    <div class="flex flex-wrap items-center gap-3">
        <p class="font-semibold text-slate-900 dark:text-slate-100" th:text="${message.visibleAuthor()}">Author</p>
        <time class="text-xs text-slate-500 dark:text-slate-400" th:text="${message.createdAt() != null ? #temporals.format(message.createdAt(), 'dd MMM yyyy HH:mm') : ''}">20 Sept 2026 14:30</time>
    </div>
    <p class="mt-3 whitespace-pre-wrap text-slate-700 dark:text-slate-200" th:classappend="${message.deleted()} ? ' italic text-slate-500 dark:text-slate-400' : ''" th:text="${message.content()}">Message</p>
    <p th:if="${analysisError}" class="mt-3 rounded-lg border border-red-200 bg-red-50 p-3 text-sm font-medium text-red-800"
       th:text="${analysisError}">Analysis failed.</p>
    <div th:if="${message.analyzed()}" class="mt-3 flex flex-wrap items-center gap-2">
        <span class="rounded-full bg-violet-100 dark:bg-violet-950/50 px-2.5 py-1 text-xs font-semibold text-violet-700 dark:text-violet-300"
              th:text="${message.sentiment().displayName}">Happy</span>
        <span th:each="topic : ${message.topics()}"
              class="rounded-full bg-slate-100 dark:bg-slate-700 px-2.5 py-1 text-xs font-medium text-slate-600 dark:text-slate-300"
              th:text="${topic}">Topic</span>
    </div>
    <div class="mt-4 flex flex-wrap items-center gap-4">
        <a th:href="@{/admin/messages/{id}/export.pdf(id=${message.id()})}"
           class="text-sm font-semibold text-emerald-700 dark:text-emerald-400 hover:text-emerald-900 dark:hover:text-emerald-300">
            <i class="fa-solid fa-file-pdf mr-1"></i> Export PDF
        </a>
        <form th:if="${!message.deleted() && !message.analyzed()}" method="post"
              th:action="@{/admin/messages/{id}/analyze(id=${message.id()})}"
              th:hx-post="@{/admin/messages/{id}/analyze(id=${message.id()})}"
              hx-target="closest .admin-message" hx-swap="outerHTML">
            <button type="submit" class="text-sm font-semibold text-sky-700 dark:text-sky-400 hover:text-sky-900 dark:hover:text-sky-300">Analyze message</button>
        </form>
        <form th:if="${!message.deleted()}" method="post" th:action="@{/admin/messages/{id}/delete(id=${message.id()})}">
            <button type="submit" class="text-sm font-semibold text-rose-700 dark:text-rose-300 hover:text-rose-900 dark:hover:text-rose-300">Delete message</button>
        </form>
    </div>
</article>
</body>
</html>
