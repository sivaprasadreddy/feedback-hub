<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Login</title>
</head>
<body>

<div layout:fragment="content">
    <div class="flex min-h-[calc(100dvh-8rem)] items-center justify-center py-6">
        <div class="w-full max-w-md overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 shadow-xl shadow-slate-200/60">
            <div class="bg-gradient-to-br from-slate-900 via-slate-800 to-sky-900 px-8 py-8 text-center text-white">
                <span class="mx-auto inline-flex h-14 w-14 items-center justify-center rounded-full bg-white/10 text-2xl ring-1 ring-white/20">
                    <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
                </span>
                <h1 class="mt-4 text-2xl font-bold">Welcome back</h1>
                <p class="mt-1 text-sm text-slate-300">Sign in to your account.</p>
            </div>
            <div class="p-6 sm:p-8">
                <div th:if="${param.error}">
                    <div class="mb-5 rounded-lg border border-rose-200 dark:border-rose-800 bg-rose-50 dark:bg-rose-950/50 px-4 py-3 text-sm text-rose-700 dark:text-rose-300" role="alert">
                        <i class="fa-solid fa-circle-exclamation mr-2" aria-hidden="true"></i>Invalid email or password.
                    </div>
                </div>
                <div th:if="${message}">
                    <div class="mb-5 rounded-lg border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/50 px-4 py-3 text-sm text-emerald-700 dark:text-emerald-300"
                         role="status" th:text="${message}">Success Message</div>
                </div>
                <div th:if="${param.logout}">
                    <div class="mb-5 rounded-lg border border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/50 px-4 py-3 text-sm text-emerald-700 dark:text-emerald-300" role="status">
                        <i class="fa-solid fa-circle-check mr-2" aria-hidden="true"></i>You have been logged out.
                    </div>
                </div>
                <form id="loginForm" method="post" th:action="@{/login}" class="space-y-5">
                    <div>
                        <label for="username" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Email <span class="text-rose-600 dark:text-rose-400">*</span></label>
                        <input type="email" id="username" name="username" required autocomplete="email"
                               class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 text-slate-900 dark:text-slate-100 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
                               placeholder="you@example.com" />
                    </div>

                    <div>
                        <label for="password" class="mb-2 block text-sm font-semibold text-slate-700 dark:text-slate-200">Password <span class="text-rose-600 dark:text-rose-400">*</span></label>
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                               class="w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 px-4 py-3 text-slate-900 dark:text-slate-100 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"
                               placeholder="Enter your password" />
                    </div>
                    <button type="submit" class="inline-flex w-full items-center justify-center gap-2 rounded-lg bg-sky-600 px-4 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:ring-offset-2">
                        <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>Sign in
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
