<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard}">
<head>
    <title>Manage Replies</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-2xl font-bold text-slate-900">Manage Replies</h1>
    <p class="mt-2 text-slate-600">Review discussion replies and remove inappropriate content.</p>
    <div class="mt-6 space-y-4">
        <article th:each="reply : ${replies}" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex flex-wrap items-center gap-3">
                <p class="font-semibold text-slate-900" th:text="${reply.visibleAuthor()}">Author</p>
                <time class="text-xs text-slate-500" th:text="${reply.createdAt() != null ? #temporals.format(reply.createdAt(), 'dd MMM yyyy HH:mm') : ''}">20 Sept 2026 14:30</time>
            </div>
            <p class="mt-3 whitespace-pre-wrap text-slate-700" th:classappend="${reply.deleted()} ? ' italic text-slate-500' : ''" th:text="${reply.content()}">Reply</p>
            <span th:if="${reply.spam()}"
                  class="mt-3 inline-flex rounded-full bg-rose-100 px-2.5 py-1 text-xs font-semibold text-rose-700">Spam</span>
            <div class="mt-4 flex items-center gap-4">
                <a th:href="@{/messages/{id}(id=${reply.messageId()})}" class="text-sm font-semibold text-sky-700 hover:text-sky-900">View discussion</a>
                <form th:if="${!reply.deleted()}" method="post" th:action="@{/admin/replies/{id}/delete(id=${reply.id()})}">
                    <button type="submit" class="text-sm font-semibold text-rose-700 hover:text-rose-900">Delete reply</button>
                </form>
            </div>
        </article>
        <p th:if="${#lists.isEmpty(replies)}" class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-slate-500">No replies to review.</p>
    </div>
    <nav th:if="${page.hasPreviousPage() || page.hasNextPage()}" aria-label="Reply pages" class="mt-6 flex items-center justify-between">
        <a th:if="${page.hasPreviousPage()}" th:href="@{/admin/replies(page=${page.currentPageNo() - 1})}"
           class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Previous</a>
        <span th:unless="${page.hasPreviousPage()}"></span>
        <span class="text-sm text-slate-600" th:text="|Page ${page.currentPageNo()} of ${page.totalPages()}|">Page 1</span>
        <a th:if="${page.hasNextPage()}" th:href="@{/admin/replies(page=${page.currentPageNo() + 1})}"
           class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50">Next</a>
        <span th:unless="${page.hasNextPage()}"></span>
    </nav>
</div>
</body>
</html>
