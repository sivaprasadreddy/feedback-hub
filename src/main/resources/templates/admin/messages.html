<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard}">
<head>
    <title>Manage Messages</title>
</head>
<body>
<div layout:fragment="content">
    <h1 class="text-2xl font-bold text-slate-900">Manage Messages</h1>
    <p class="mt-2 text-slate-600">Review feedback and remove inappropriate messages.</p>
    <div class="mt-6 space-y-4">
        <article th:each="message : ${messages}" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
            <div class="flex items-center justify-between gap-4">
                <p class="font-semibold text-slate-900" th:text="${message.visibleAuthor()}">Author</p>
                <time class="text-xs text-slate-500" th:text="${message.createdAt() != null ? #temporals.format(message.createdAt(), 'yyyy-MM-dd HH:mm') : ''}">Created</time>
            </div>
            <p class="mt-3 whitespace-pre-wrap text-slate-700" th:classappend="${message.deleted()} ? ' italic text-slate-500' : ''" th:text="${message.content()}">Message</p>
            <form th:if="${!message.deleted()}" method="post" class="mt-4" th:action="@{/admin/messages/{id}/moderate(id=${message.id()})}">
                <button type="submit" class="text-sm font-semibold text-rose-700 hover:text-rose-900">Moderate message</button>
            </form>
        </article>
        <p th:if="${#lists.isEmpty(messages)}" class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-slate-500">No messages to review.</p>
    </div>
</div>
</body>
</html>
