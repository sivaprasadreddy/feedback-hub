<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard}">
<head>
    <title>Manage Users</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <h1 class="text-2xl font-bold text-slate-900">Manage Users</h1>
        <a th:href="@{/admin/users/new}"
           class="inline-flex items-center justify-center rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-sky-700">
            <i class="fa-solid fa-user-plus mr-2"></i> Create user
        </a>
    </div>
    <form method="get" th:action="@{/admin/users}" class="mt-6 flex flex-wrap items-end gap-3 rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
        <div>
            <label for="role-filter" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Role</label>
            <select id="role-filter" name="role" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700">
                <option value="">All roles</option>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role.displayName}"
                        th:selected="${role == selectedRole}">USER</option>
            </select>
        </div>
        <div>
            <label for="status-filter" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Status</label>
            <select id="status-filter" name="active" class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700">
                <option value="">All statuses</option>
                <option value="true" th:selected="${selectedActive == true}">Active</option>
                <option value="false" th:selected="${selectedActive == false}">Inactive</option>
            </select>
        </div>
        <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Filter</button>
        <a th:href="@{/admin/users}" class="px-2 py-2 text-sm font-medium text-slate-600 hover:text-slate-900">Clear</a>
    </form>
    <div class="mt-6 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Name</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Email</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Role</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Status</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Created</th>
                <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider text-slate-500">Actions</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-200">
            <tr th:each="user : ${users}">
                <td class="px-4 py-3 text-sm text-slate-900" th:text="${user.name()}">Name</td>
                <td class="px-4 py-3 text-sm text-slate-700" th:text="${user.email()}">email@example.com</td>
                <td class="px-4 py-3 text-sm text-slate-700" th:text="${user.role().displayName}">USER</td>
                <td class="px-4 py-3 text-sm">
                    <span th:if="${user.active()}" class="rounded-full bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">Active</span>
                    <span th:unless="${user.active()}" class="rounded-full bg-rose-50 px-2 py-1 text-xs font-medium text-rose-700">Inactive</span>
                </td>
                <td class="px-4 py-3 text-sm text-slate-700"
                    th:text="${user.createdAt() != null ? #temporals.format(user.createdAt(), 'yyyy-MM-dd HH:mm') : ''}">2026-01-01</td>
                <td class="px-4 py-3 text-sm">
                    <form th:if="${user.id() != #authentication.principal.id}"
                          method="post"
                          th:action="@{/admin/users/{id}/edit(id=${user.id()})}"
                          class="flex items-center gap-2">
                        <select name="role" aria-label="Role" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-700">
                            <option th:each="role : ${T(dev.sivalabs.speakup.users.Role).values()}"
                                    th:value="${role}"
                                    th:text="${role.displayName}"
                                    th:selected="${role == user.role()}">USER</option>
                        </select>
                        <select name="active" aria-label="Status" class="rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-sm text-slate-700">
                            <option value="true" th:selected="${user.active()}">Active</option>
                            <option value="false" th:selected="${!user.active()}">Inactive</option>
                        </select>
                        <button type="submit" class="rounded-lg bg-slate-700 px-3 py-1.5 text-xs font-semibold text-white hover:bg-slate-800">Save</button>
                    </form>
                    <span th:if="${user.id() == #authentication.principal.id}" class="text-xs text-slate-500">Current account</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
