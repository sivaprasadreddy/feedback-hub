<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{main}">
<head>
    <title>Home</title>
</head>
<body>
<div layout:fragment="content">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Feedback</h1>
            <p class="mt-1 text-slate-600">Share what is on your mind.</p>
        </div>
    </div>

    <form method="post" th:action="@{/messages}" th:object="${form}" class="mt-6 space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
        <div>
            <label for="content" class="mb-2 block text-sm font-semibold text-slate-700">Message</label>
            <textarea id="content" rows="4" th:field="*{content}" placeholder="What's on your mind?"
                      class="w-full rounded-lg border border-slate-300 px-4 py-3 text-slate-900 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20"></textarea>
            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="mt-2 text-sm text-rose-600"></p>
        </div>
        <fieldset>
            <legend class="mb-2 text-sm font-semibold text-slate-700">Post as</legend>
            <div class="flex flex-wrap gap-4">
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="radio" th:field="*{postingIdentity}" value="IDENTIFIED"/>
                    Myself
                </label>
                <label class="flex items-center gap-2 text-sm text-slate-700">
                    <input type="radio" th:field="*{postingIdentity}" value="ANONYMOUS"/>
                    Anonymous
                </label>
            </div>
            <p th:if="${#fields.hasErrors('postingIdentity')}" th:errors="*{postingIdentity}" class="mt-2 text-sm text-rose-600"></p>
        </fieldset>
        <button type="submit" class="rounded-lg bg-sky-600 px-4 py-2 text-sm font-semibold text-white hover:bg-sky-700">Post message</button>
    </form>

    <section class="mt-8" aria-labelledby="recent-heading">
        <h2 id="recent-heading" class="text-xl font-bold text-slate-900">Recent</h2>
        <div class="mt-4 space-y-4">
            <article th:each="message : ${messages}" class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between gap-4">
                    <p class="font-semibold text-slate-900" th:text="${message.visibleAuthor()}">Author</p>
                    <time class="text-xs text-slate-500"
                          th:text="${message.createdAt() != null ? #temporals.format(message.createdAt(), 'yyyy-MM-dd HH:mm') : ''}">Created</time>
                </div>
                <p class="mt-3 whitespace-pre-wrap text-slate-700"
                   th:classappend="${message.deleted()} ? ' italic text-slate-500' : ''"
                   th:text="${message.content()}">Message</p>
                <dl class="mt-4 flex flex-wrap gap-6 border-t border-slate-200 pt-3 text-sm">
                    <div><dt class="inline font-semibold text-slate-500">Upvotes</dt> <dd class="inline" th:text="${message.upvoteCount()}">0</dd></div>
                    <div><dt class="inline font-semibold text-slate-500">Downvotes</dt> <dd class="inline" th:text="${message.downvoteCount()}">0</dd></div>
                    <div><dt class="inline font-semibold text-slate-500">Replies</dt> <dd class="inline" th:text="${message.replyCount()}">0</dd></div>
                    <div><dt class="inline font-semibold text-slate-500">Your vote</dt> <dd class="inline" th:text="${message.currentUserVote() != null ? message.currentUserVote() : 'No vote'}">No vote</dd></div>
                </dl>
                <a th:href="@{/messages/{id}(id=${message.id()})}" class="mt-4 inline-block text-sm font-semibold text-sky-700 hover:text-sky-900">View message</a>
            </article>
            <p th:if="${#lists.isEmpty(messages)}" class="rounded-xl border border-dashed border-slate-300 p-6 text-center text-slate-500">No feedback yet.</p>
        </div>
    </section>
</div>
</body>
</html>
