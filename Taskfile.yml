version: '3'

vars:
  GOOS: "{{default OS .GOOS}}"
  MVNW: '{{if eq .GOOS "windows"}}mvnw.cmd{{else}}./mvnw{{end}}'
  SLEEP_CMD: '{{if eq .GOOS "windows"}}timeout{{else}}sleep{{end}}'
  REGISTRY: docker.io
  IMAGE_NAME: 'sivaprasadreddy/feedbackhub'
  VERSION: '{{.VERSION | default "latest"}}'
  CLUSTER_NAME: 'sivalabs-k8s'
  DC_FILE: "docker/compose.yml"

tasks:
  default:
    cmds:
      - task: test

  format:
    desc: Formats code
    cmds:
      - "{{.MVNW}} spotless:apply"

  test:
    desc: Run all the tests
    deps: [ format ]
    cmds:
      - "{{.MVNW}} clean verify"

  build_image:
    desc: Build Docker Image using Buildpacks
    cmds:
      - "{{.MVNW}} -pl feedbackhub package spring-boot:build-image -DskipTests -DdockerImageName={{.REGISTRY}}/{{.IMAGE_NAME}}"

  build_image:amd64:
    desc: Build and publish the AMD64 OCI image
    cmds:
      - "{{.MVNW}} -pl feedbackhub package spring-boot:build-image -DskipTests -DdockerImageName={{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-amd64 -Dspring-boot.build-image.imagePlatform=linux/amd64"
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-amd64

  build_image:arm64:
    desc: Build and publish the ARM64 OCI image
    cmds:
      - "{{.MVNW}} -pl feedbackhub package spring-boot:build-image -DskipTests -DdockerImageName={{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-arm64 -Dspring-boot.build-image.imagePlatform=linux/arm64"
      - docker push {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-arm64

  build_image_multiarch:
    desc: Build and publish the multi-arch OCI image (requires amd64 and arm64 images to be published first)
    cmds:
      # Keep these builds sequential because both Maven invocations write to the
      # same target directory and Spring Boot repackages the same JAR.
      - task: build_image:amd64
      - task: build_image:arm64
      - docker manifest create {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}
        --amend {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-amd64
        --amend {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}-arm64
      - docker manifest push {{.REGISTRY}}/{{.IMAGE_NAME}}:{{.VERSION}}

  start:
    desc: Start the application
    deps: [ build_image ]
    cmds:
      - docker compose -f "{{.DC_FILE}}" up --force-recreate -d

  stop:
    desc: Stop the application
    cmds:
      - docker compose -f "{{.DC_FILE}}" stop
      - docker compose -f "{{.DC_FILE}}" rm -f

  restart:
    desc: Restarts the application
    cmds:
      - task: stop
      - task: sleep
      - task: start

  kind_create:
    desc: Create KinD cluster
    cmds:
      - ./k8s/kind/kind-cluster.sh create

  kind_destroy:
    desc: Destroy KinD cluster
    cmds:
      - ./k8s/kind/kind-cluster.sh destroy

  k8s_deploy:
    desc: Deploy application on Kind cluster
    cmds:
      - kind load docker-image {{.IMAGE_NAME}} --name {{.CLUSTER_NAME}}
      - kubectl apply -f k8s/manifests/

  k8s_undeploy:
    desc: Undeploy application from Kind cluster
    cmds:
      - kubectl delete -f k8s/manifests/

  sleep:
    desc: Sleeps for the given number of seconds
    vars:
      DURATION: "{{default 5 .DURATION}}"
    cmds:
      - "{{.SLEEP_CMD}} {{.DURATION}}"
